name: CD Pipeline

# 只有 push 到 main 才觸發部署
on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build 並推送 Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v4

      # 登入 Docker Hub
      # DOCKER_USERNAME 和 DOCKER_TOKEN 存在 GitHub Secrets
      - name: 登入 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: 設定 Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 產生 Image Tag（用 Git commit hash 當版本號）
      - name: 產生 Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/diet-ai-system
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest

      # Build 並推送到 Docker Hub
      - name: Build 並推送 Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max